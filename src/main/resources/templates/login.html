<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş yap — İlaç Kadranı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/login.css}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <!-- SOL: Tanıtım paneli -->
    <div class="class_PromotionalPanel">
      <!-- SOL: Label İlaç Katranı  -->
      <div class="class_Logo">
          <svg class="class_LogoSymbol" aria-hidden="true" viewBox="0 0 120 120" width="120">
            <rect width="120" height="120" fill="#155E6B"/>
            <circle cx="60" cy="60" r="40" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="10"/>
            <circle cx="60" cy="60" r="40" fill="none" stroke="#FFC145" stroke-width="10"
                    stroke-linecap="round" stroke-dasharray="88 252" transform="rotate(-90 60 60)"/>
            <line x1="50" y1="68" x2="74" y2="54" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
          </svg>
        <span>İlaç Kadranı</span>
      </div>


      <!-- SOL: Mini kadran  -->
      <div class="class_Introduction">         
          <svg class="kadrancizimi" role="img" aria-label="Sıradaki ilaç: 11:00 Göz damlası" viewBox="0 0 260 260">
            <!-- Arka plan -->
            <rect width="260" height="260" fill="#155E6B"/>

            <!-- 1. Dış soluk halka -->
            <circle cx="130" cy="130" r="115" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="14"/>

            <!-- 2. Gri iz parçaları -->
            <g fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="8" stroke-linecap="round">
              <path d="M149.75 37.08 A95 95 0 0 1 222.92 110.25"/>
              <path d="M86.87 214.65 A95 95 0 0 1 39.65 159.36"/>
              <path d="M37.08 110.25 A95 95 0 0 1 110.25 37.08"/>
            </g>

            <!-- 3. Renkli yaylar: hepsi aynı noktada biter, alttan üste çizilir -->
            <g fill="none" stroke-width="10" stroke-linecap="round">
              <path d="M223.83 144.86 A95 95 0 0 1 125.03 224.87" stroke="#A8DDE6"/>
              <path d="M216.79 168.64 A95 95 0 0 1 125.03 224.87" stroke="#F2766B"/>
              <path d="M193.57 200.60 A95 95 0 0 1 125.03 224.87" stroke="#FFC145"/>
            </g>

            <!-- 4. Tik işaretleri -->
            <g stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round">
              <line x1="130" y1="52" x2="130" y2="44"/>
              <line x1="185.15" y1="74.85" x2="190.81" y2="69.19"/>
              <line x1="208" y1="130" x2="216" y2="130"/>
              <line x1="185.15" y1="185.15" x2="190.81" y2="190.81"/>
              <line x1="52" y1="130" x2="44" y2="130"/>
              <line x1="74.85" y1="74.85" x2="69.19" y2="69.19"/>
            </g>

            <!-- 5. İbre + uçtaki nokta -->
            <line x1="155.80" y1="197.22" x2="164.41" y2="219.63" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
            <circle cx="164.41" cy="219.63" r="4.5" fill="#fff"/>

            <!-- 6. Yazılar -->
            <g fill="#fff" text-anchor="middle" font-family="inherit">
              <text x="130" y="100" font-size="14" fill-opacity=".7">Sıradaki</text>
              <text x="130" y="148" font-size="48" font-weight="600">11:00</text>
              <text x="130" y="176" font-size="16" font-weight="500">Göz damlası</text>
            </g>
          </svg>

          <p class="promo-title">İlaç saatlerin tek bir kadranda</p>
        <p class="promo-text">Dozunu onayla, kaçırdıysan uyarı al, haftanı tek bakışta gör.</p>
        </div>

        <ul class="class_Properties">
          <li>Saat aralığına göre onay</li>
          <li>Kaçırılan doz uyarısı</li>
          <li>15 dakika erteleme ve atlama nedeni</li>
        </ul>
      </div>

    <!-- SAĞ: Giriş paneli -->
    <div class="class_LoginPanel">
      <form action="" class="formCard">
        <div class="form_rightHandle">
          <p class="form_rightHandleTitle">Tekrar hoş geldin</p>
          <p class="form_rightDescriptionTitle">İlaç saatlerini görmek için giriş yap</p>
        </div>
        <div class="form_rightEmail">
          <label for="e-mail" class="form_rightEmailTitle">E-Mail</label>
          <input type="email" id="e-mail" class="form_rightEmailInput" placeholder="ornek@eposta.com.tr">  
        </div>
        <div class="form_rightPassword">
          <label for="password" class="form_rightPasswordTitle">Password</label>
          <div class="form_rightInputBox">
            <input type="password" placeholder="*********">
            <a href="">Show</a>
          </div>
        </div>
        <div class="form_rightOptions">
          <label for=""class="form_rightRemember">
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" class="form_rightForgot">Forgive me password</a>
        </div>
        <button class="form_rightButtonLogin"> 
          <a href="" class="form_rightTextLogin">Login</a>
        </button>
        <div class="form_rightDivider">
          <span class="form_rightDividerLine"></span>
          <span class="form_rightDividerText">veya</span>
          <span class="form_rightDividerLine"></span>
        </div>
        <button type="submit" class="form_rightLoginGoogle"> <a href="">Google ile devam et</a></button>
        
      </form>
    </div>

  </main>
  <footer></footer>
</body>
</html>
